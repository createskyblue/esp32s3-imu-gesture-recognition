<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32-S3 模板</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:16px;font-family:Arial,'Microsoft YaHei',sans-serif;background:#eef3f7;color:#172033}
    main{width:min(960px,100%);margin:0 auto;display:grid;gap:14px}
    h1{margin:0 0 4px;font-size:28px;line-height:1.15}
    h2{margin:0 0 10px;font-size:17px;color:#374151}
    button,input,select{border:1px solid #97acbf;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer;font-size:14px}
    button{background:#eaf4f2;color:#172033}
    button:disabled{opacity:.5;cursor:not-allowed}
    button.primary{background:#0891b2;border-color:#0891b2;color:#fff}
    button.primary:hover:not(:disabled){background:#0e7490}
    input{width:100%;background:#fff;color:#172033;border:1px solid #b8c7d4}
    input[type=file]{padding:8px;font-size:13px}
    .top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:4px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .panel{background:#fff;border:1px solid #d7e0ea;border-radius:8px;padding:18px}
    .subtitle{color:#5c6878;font-size:14px;margin-top:2px}
    .network-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    .card{border:1px solid #d7e0ea;border-radius:8px;padding:14px;background:#fbfdff}
    .card h3{font-size:14px;color:#5c6878;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .card .value{font-size:22px;font-weight:800;color:#172033;word-break:break-all}
    .card .value.ok{color:#166534}
    .card .value.wait{color:#92400e}
    .card .label-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
    .badge.ok{background:#dcfce7;color:#166534}
    .badge.warn{background:#fef3c7;color:#92400e}
    .badge.info{background:#dbeafe;color:#1e40af}
    .wifi-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:12px}
    .wifi-form label{display:grid;gap:5px;font-size:13px;color:#5c6878}
    .wifi-message{margin-top:10px;min-height:20px;font-size:13px;color:#5c6878}
    .wifi-message.success{color:#166534}
    .wifi-message.error{color:#991b1b}
    .sys-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .sys-item{border:1px solid #d7e0ea;border-radius:8px;padding:12px;text-align:left;background:#fbfdff}
    .sys-item .label{font-size:12px;color:#5c6878;margin-bottom:2px}
    .sys-item .value{font-size:16px;line-height:1.45;font-weight:800;word-break:break-word}
    .usage-total{margin-top:4px;color:#475569;font-size:13px;font-weight:700}
    .usage-detail{font-size:15px;line-height:1.5;font-weight:800;word-break:break-word}
    .usage-separator{padding:0 4px;color:#94a3b8}
    .task-details{margin-top:10px;border:1px solid #d7e0ea;border-radius:8px;overflow:hidden;background:#fff}
    .task-details summary{padding:10px 12px;color:#475569;font-size:13px;font-weight:700;cursor:pointer;list-style:none}
    .task-details summary::-webkit-details-marker{display:none}
    .task-details summary::after{content:'展开';float:right;color:#0891b2}
    .task-details[open] summary::after{content:'收起'}
    .task-details pre{margin:0;border-radius:0;border-top:1px solid #d7e0ea;max-height:200px}
    pre{white-space:pre-wrap;background:#0f172a;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:260px;margin-top:10px}
    .ota-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
    .ota-form label{display:grid;gap:5px;font-size:13px;color:#5c6878}
    .ota-progress{margin-top:6px;height:12px;border-radius:999px;background:#e5e7eb;overflow:hidden;border:1px solid #d7e0ea}
    .ota-progress span{display:block;height:100%;width:0;background:#0891b2;transition:width .3s ease}
    .ota-status{margin-top:6px;font-size:13px;color:#5c6878;min-height:18px}
    footer{margin-top:8px;text-align:center;color:#9ca3af;font-size:12px}
    @media(max-width:760px){body{padding:10px}.network-grid,.sys-grid,.wifi-form,.ota-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>ESP32-S3 模板</h1>
      <div class="subtitle">WiFi 配网 · 文件管理 · OTA 升级</div>
    </div>
    <div class="actions">
      <button onclick="location.href='/files'">📁 文件管理</button>
      <button onclick="location.reload()">🔄 刷新</button>
    </div>
  </div>

  <!-- WiFi Status -->
  <div class="panel">
    <h2>📡 网络状态</h2>
    <div class="network-grid">
      <div class="card">
        <h3>STA (连接路由器)</h3>
        <div class="label-row">
          <span class="value" id="sta-status">--</span>
          <span class="badge" id="sta-badge">检测中</span>
        </div>
        <div style="margin-top:8px;font-size:13px;color:#5c6878">
          SSID: <b id="sta-ssid" style="color:#172033">--</b>
        </div>
        <div style="font-size:13px;color:#5c6878">
          IP: <b id="sta-ip" style="color:#172033">--</b>
        </div>
      </div>
      <div class="card">
        <h3>AP (配置热点)</h3>
        <div class="value" id="ap-ssid" style="font-size:20px">--</div>
        <div style="margin-top:6px;font-size:13px;color:#5c6878">
          IP: <b id="ap-ip" style="color:#172033">--</b>
        </div>
        <div style="font-size:13px;color:#5c6878">
          密码: <b id="ap-pass" style="color:#172033">--</b>
        </div>
      </div>
    </div>

    <!-- WiFi Config Form -->
    <h2 style="margin-top:4px">🔧 WiFi 配网</h2>
    <form id="wifi-form" class="wifi-form" onsubmit="event.preventDefault();saveWiFi()">
      <label>SSID（WiFi 名称）<input type="text" id="wifi-ssid" placeholder="请输入 WiFi 名称" maxlength="32"></label>
      <label>密码<input type="password" id="wifi-pass" placeholder="请输入 WiFi 密码" maxlength="63"></label>
      <button class="primary" type="submit" style="height:fit-content">保存并连接</button>
    </form>
    <div class="wifi-message" id="wifi-msg"></div>
  </div>

  <!-- System Info -->
  <div class="panel">
    <h2>💻 系统信息 <span style="font-weight:400;font-size:13px;color:#5c6878" id="debug-uptime">运行时间 --</span></h2>
    <div class="sys-grid">
      <div class="sys-item">
        <div class="label">内部堆</div>
        <div class="usage-total" id="internal-heap-total">总量 --</div>
        <div class="usage-detail" id="internal-heap-detail"><span id="internal-heap-used">已用 --</span><span class="usage-separator">；</span><span id="internal-heap-free">剩余 --</span></div>
      </div>
      <div class="sys-item">
        <div class="label">PSRAM</div>
        <div class="usage-total" id="psram-total">总量 --</div>
        <div class="usage-detail" id="psram-detail"><span id="psram-used">已用 --</span><span class="usage-separator">；</span><span id="psram-free">剩余 --</span></div>
      </div>
      <div class="sys-item secondary"><div class="label">历史最低剩余</div><div class="value" id="min-heap">--</div></div>
      <div class="sys-item secondary"><div class="label">最大连续块</div><div class="value" id="largest-block">--</div></div>
    </div>
    <details class="task-details">
      <summary>任务列表（栈剩余）</summary>
      <pre id="task-list">任务列表加载中...</pre>
    </details>
    <div style="margin-top:8px;font-size:12px;color:#9ca3af">
      固件: <span id="build-id">--</span> | 构建时间: <span id="build-ts">--</span>
    </div>
  </div>

  <!-- OTA -->
  <div class="panel">
    <h2>⬆️ OTA 升级</h2>
    <form id="ota-form" class="ota-form" onsubmit="event.preventDefault();startOta()">
      <label>固件文件 (.bin)<input type="file" id="ota-fw-file" accept=".bin"></label>
      <label>文件系统文件 (.bin)<input type="file" id="ota-fs-file" accept=".bin"></label>
      <button class="primary" type="submit" id="ota-btn" style="height:fit-content">开始更新</button>
      <label>固件链接<input type="url" id="ota-fw-url" placeholder="https://server/app.bin（可选）" onblur="saveOtaUrls()"></label>
      <label>文件系统链接<input type="url" id="ota-fs-url" placeholder="https://server/storage.bin（可选）" onblur="saveOtaUrls()"></label>
    </form>
    <div class="ota-progress"><span id="ota-bar"></span></div>
    <div class="ota-status" id="ota-status">空闲</div>
  </div>

  <footer>ESP32-S3 Template · Powered by ESP-IDF</footer>
</main>

<script>
const AP_PASS = 'template1234';
document.getElementById('ap-pass').textContent = AP_PASS;

/* ── format helpers ────────────────────────────────────────────────── */
function formatBytes(n, mbDigits) {
  n = Number(n);
  if (!Number.isFinite(n) || n < 0) return '--';
  if (n >= 1048576) return (n/1048576).toFixed(mbDigits === undefined ? 1 : mbDigits) + ' MB';
  if (n >= 1024) return (n/1024).toFixed(1) + ' KB';
  return n + ' B';
}
function formatPercent(ratio) {
  const percent = Number(ratio) * 100;
  if (!Number.isFinite(percent)) return '--';
  if (percent > 0 && percent < 0.01) return '<0.01';
  const digits = percent < 1 || percent > 99 ? 2 : 0;
  return percent.toFixed(digits).replace(/\.0+$/, '').replace(/(\.\d)0$/, '$1');
}
function formatUsage(used, total, free) {
  total = Number(total);
  used = Number(used);
  free = Number(free);
  if (!Number.isFinite(total) || total <= 0) {
    return {total: '总量 N/A', used: '已用 N/A', free: '剩余 N/A'};
  }
  if (!Number.isFinite(used)) used = Math.max(0, total - free);
  if (!Number.isFinite(free)) free = Math.max(0, total - used);
  used = Math.max(0, Math.min(total, used));
  free = Math.max(0, Math.min(total, free));
  const totalDigits = total >= 1048576 ? 2 : undefined;
  const freeDigits = free >= 1048576 ? 3 : undefined;
  return {
    total: '总量 ' + formatBytes(total, totalDigits),
    used: '已用 ' + formatBytes(used, used >= 1048576 ? 2 : undefined) +
      '（' + formatPercent(used / total) + '%）',
    free: '剩余 ' + formatBytes(free, freeDigits) +
      '（' + formatPercent(free / total) + '%）'
  };
}
function renderUsage(prefix, used, total, free) {
  const usage = formatUsage(used, total, free);
  document.getElementById(prefix + '-total').textContent = usage.total;
  document.getElementById(prefix + '-used').textContent = usage.used;
  document.getElementById(prefix + '-free').textContent = usage.free;
}
function formatUptime(ms) {
  if (!ms) return '--';
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h > 0) return h + 'h ' + (m % 60) + 'm';
  if (m > 0) return m + 'm ' + (s % 60) + 's';
  return s + 's';
}

/* ── network + system refresh ──────────────────────────────────────── */
async function refresh() {
  try {
    const r = await fetch('/network.json');
    const d = await r.json();
    const ok = d.sta_connected;
    const staEl = document.getElementById('sta-status');
    const badgeEl = document.getElementById('sta-badge');
    if (ok) {
      staEl.textContent = d.sta_ip; staEl.className = 'value ok';
      badgeEl.textContent = '已连接'; badgeEl.className = 'badge ok';
    } else {
      staEl.textContent = '未连接'; staEl.className = 'value wait';
      badgeEl.textContent = d.sta_ssid ? '连接中' : '未配置';
      badgeEl.className = d.sta_ssid ? 'badge warn' : 'badge info';
    }
    document.getElementById('sta-ssid').textContent = d.sta_ssid || '(未配置)';
    document.getElementById('sta-ip').textContent = ok ? d.sta_ip : '--';
    document.getElementById('ap-ssid').textContent = d.ap_ssid;
    document.getElementById('ap-ip').textContent = d.ap_ip;
    if (d.sta_ssid) document.getElementById('wifi-ssid').value = d.sta_ssid;
    document.getElementById('build-id').textContent = d.app_build_id;
    document.getElementById('build-ts').textContent = d.build_timestamp;
  } catch(e) { console.error('network', e); }

  try {
    const r = await fetch('/debug.json');
    const d = await r.json();
    renderUsage('internal-heap', d.internal_used_heap, d.internal_total_heap, d.internal_free_heap);
    document.getElementById('min-heap').textContent = formatBytes(d.internal_min_free_heap);
    document.getElementById('largest-block').textContent = formatBytes(d.internal_largest_free_block);
    renderUsage('psram', d.psram_used_heap, d.psram_total_heap, d.psram_free_heap);
    document.getElementById('debug-uptime').textContent = '运行时间 ' + formatUptime(d.uptime_ms);
    document.getElementById('task-list').textContent = d.task_list || '(无任务信息)';
  } catch(e) { console.error('debug', e); }

  try {
    const r = await fetch('/ota/status');
    const d = await r.json();
    document.getElementById('ota-bar').style.width = d.progress + '%';
    document.getElementById('ota-status').textContent =
      d.phase + ' · ' + d.message + (d.current_label ? ' · ' + d.current_label : '');
  } catch(e) { /* OTA endpoint not critical */ }
}

/* ── WiFi save ─────────────────────────────────────────────────────── */
async function saveWiFi() {
  const ssid = document.getElementById('wifi-ssid').value.trim();
  const pass = document.getElementById('wifi-pass').value;
  const msg = document.getElementById('wifi-msg');
  if (!ssid) { msg.textContent = '请输入 WiFi 名称'; msg.className = 'wifi-message error'; return; }
  msg.textContent = '正在保存...'; msg.className = 'wifi-message';
  try {
    const r = await fetch('/wifi_config.json', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ssid, password: pass})
    });
    const d = await r.json();
    if (d.ok) {
      msg.textContent = '✅ 已保存，正在连接 ' + ssid + '...';
      msg.className = 'wifi-message success';
      document.getElementById('wifi-pass').value = '';
    } else {
      msg.textContent = '保存失败'; msg.className = 'wifi-message error';
    }
  } catch(e) {
    msg.textContent = '网络错误: ' + e.message; msg.className = 'wifi-message error';
  }
}

/* ── OTA ───────────────────────────────────────────────────────────── */
const OTA_LS_KEY = 'ota_urls';
function saveOtaUrls() {
  try {
    localStorage.setItem(OTA_LS_KEY, JSON.stringify({
      fw: document.getElementById('ota-fw-url').value,
      fs: document.getElementById('ota-fs-url').value
    }));
  } catch(e) {}
}
function restoreOtaUrls() {
  try {
    const s = JSON.parse(localStorage.getItem(OTA_LS_KEY));
    if (s) {
      if (s.fw) document.getElementById('ota-fw-url').value = s.fw;
      if (s.fs) document.getElementById('ota-fs-url').value = s.fs;
    }
  } catch(e) {}
}

let otaPollTimer = null;
function setOtaProgress(pct, text) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  document.getElementById('ota-bar').style.width = p + '%';
  document.getElementById('ota-status').textContent = text || ('OTA ' + p.toFixed(0) + '%');
}
async function pollOtaStatus() {
  try {
    const r = await fetch('/ota/status');
    const d = await r.json();
    setOtaProgress(d.progress, [d.phase, d.progress+'%', d.current_label, d.message].filter(Boolean).join(' · '));
    if (d.phase === 'done' || d.phase === 'failed' || d.phase === 'idle') {
      clearInterval(otaPollTimer); otaPollTimer = null;
      document.getElementById('ota-btn').disabled = false;
      if (d.reboot_required) {
        document.getElementById('ota-status').textContent += '，3秒后刷新...';
        setTimeout(() => location.reload(), 3000);
      }
    }
  } catch(e) { setOtaProgress(0, '状态获取失败'); }
}

function uploadFile(file, endpoint, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', endpoint, true);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch(e) { resolve({ok: true}); }
      } else { reject(new Error(xhr.responseText || ('HTTP ' + xhr.status))); }
    };
    xhr.onerror = () => reject(new Error('网络连接失败'));
    xhr.ontimeout = () => reject(new Error('上传超时'));
    xhr.timeout = 300000;
    xhr.send(file);
  });
}

async function startOta() {
  const fwFile = document.getElementById('ota-fw-file').files[0];
  const fsFile = document.getElementById('ota-fs-file').files[0];
  const fwUrl = document.getElementById('ota-fw-url').value.trim();
  const fsUrl = document.getElementById('ota-fs-url').value.trim();
  const btn = document.getElementById('ota-btn');

  if (!fwFile && !fsFile && !fwUrl && !fsUrl) {
    setOtaProgress(0, '请至少选择一个文件或填写一个链接'); return;
  }

  if (fwFile || fsFile) {
    btn.disabled = true;
    try {
      if (fwFile) {
        setOtaProgress(0, '上传固件: ' + fwFile.name);
        await uploadFile(fwFile, '/ota/upload/firmware', (loaded, total) => {
          setOtaProgress(Math.round(loaded/total*100), '上传固件: ' + Math.round(loaded/total*100) + '%');
        });
        setOtaProgress(100, '固件上传成功');
      }
      if (fsFile) {
        setOtaProgress(0, '上传文件系统: ' + fsFile.name);
        await uploadFile(fsFile, '/ota/upload/filesystem', (loaded, total) => {
          setOtaProgress(Math.round(loaded/total*100), '上传文件系统: ' + Math.round(loaded/total*100) + '%');
        });
        setOtaProgress(100, '文件系统上传成功');
      }
      setOtaProgress(100, '上传完成，设备即将重启，3秒后刷新...');
      setTimeout(() => location.reload(), 3000);
    } catch(err) {
      btn.disabled = false;
      setOtaProgress(0, '上传失败: ' + err.message);
    }
  } else {
    btn.disabled = true;
    setOtaProgress(1, 'OTA 已提交，等待下载...');
    try {
      const r = await fetch('/ota/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({firmware_url: fwUrl, filesystem_url: fsUrl})
      });
      if (!r.ok) throw new Error(await r.text());
      await r.json();
      if (otaPollTimer) clearInterval(otaPollTimer);
      otaPollTimer = setInterval(pollOtaStatus, 1000);
      pollOtaStatus();
    } catch(err) {
      btn.disabled = false;
      setOtaProgress(0, 'OTA 启动失败: ' + err.message);
    }
  }
}

/* ── init ──────────────────────────────────────────────────────────── */
restoreOtaUrls();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
